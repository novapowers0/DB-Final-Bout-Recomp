[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true

[runtime]
window_title = "DBFinalBout Recompiled"
memcard_dir = "saves"
# Debug server (TCP 4370) for live analysis: probe_ram.py / ram_dump.py /
# stall_report.py connect here. Keep it ON while testing.
debug_port = 4370
# Capture runtime-loaded overlays (STEP*.BIN: menu/battle code) so the dev box
# can recompile them native via tools/compile_overlays.py. The fight render
# funnel (screen_extent culls 0x200/0x1E0) lives in the STEP40 overlay — until
# it's captured and recompiled, widescreen culls can't widen that code.
overlay_cache = true
# NOTE (2026-08-18): the cross-fragment load-delay codegen bug that failed 8
# menu fragments (psx_ldd_* undeclared) and produced a garbage-jump crash
# (0xD7FFFFAC) when recompiled is FIXED (code_generator.cpp: defer_load now
# declares the psx_ldd_<addr> temp at the outer load-delay block scope instead
# of inside the PGXP scope block). Overlays recompile clean (10 shards OK; the
# 2 audit failures are data-as-code false positives at 0x80002030+).
# Session history: append-only overlay_captures.addendum.jsonl + the durable
# overlay_captures.json manifest next to the exe. Every overlay DMA'd into RAM
# during play is recorded with its load address + CRC, so the session can be
# analyzed offline (tools/compile_overlays.py + ram_dump.py).
overlay_capture_history = true
# Persist capture bookkeeping into the project (relative to project root) so
# analysis scripts find it without guessing the exe dir.
overlay_capture_persist_dir = "build-release"

[video]
# Final Bout uses several borderline PS1 texture-window and polygon-edge cases.
# Keep the faithful software path as the release default; the GL path remains
# available for other profiles but previously exposed missing face textures and
# clipped lower-leg polygons here.
renderer = "software"
offer_vulkan = true
aspect_ratio = "4:3"
supersampling = 1
antialiasing = false
texture_filtering = "nearest"
geometry_correction = false
perspective_texturing = false
pgxp_cpu_mode = false

# True-widescreen codegen sites. The psx.enhancement.widescreen mod moves the
# display aspect off 4:3; auto_screen_x then widens every GTE screen-extent
# cull that matches the render-funnel signature so the fight reveals the extra
# horizontal world (identity at 4:3). auto_backdrop preloads scrolling
# backdrop column windows for the wider frame. gte_game_mode arms the generic
# 3D-activity detector that keeps menus/2D from being stretched.
[widescreen]
gte_game_mode = true
# squash=false: the GTE X-squash corrupts this game (its gameplay/rendering
# logic reads projected SXY for actor culling and UI layout, so compressed
# coords drop character polygons and break menus). With squash off the guest
# stays 100% vanilla and the 4:3 frame is presented stretched to the wide
# aspect — no FOV widening, zero guest corruption. NOTE: this means Final
# Bout's widescreen is STRETCH-ONLY (like BR2 with squash, but the X-squash
# is off). True extra-FOV would require squash=true, which is unsafe here.
squash = false
native_wide = false
# Presentation offers (same framework keys as Bloody Roar II). offer=true
# exposes the 16:9 choice in the launcher; adaptive_view lets the live window
# shape drive the aspect (clamped to the widest offered = 16:9). Ultrawide
# 21:9 is NOT offered: stretch is safe, but the auto_screen_x cull widening
# has not been validated at 21:9 for this funnel.
offer = true
adaptive_view = true
# precise_nclip: fighting game with lots of geometry near the frame edges —
# the same class as Bloody Roar II, where the widened NCLIP clamp avoids
# wide-edge clipping artifacts on the extended FOV (verified in BR2).
# Exact NCLIP consumes enhancement provenance and can reject the same edge
# triangles whose SXY values this title reads back for its own culling.
precise_nclip = false

[widescreen.cull]
auto_screen_x = false
# Real screen-extent signature of Final Bout (SLUS_004.93): the fight render
# funnel lives in the STEP40 overlay and uses `slti ...,0x200` (X=512) paired
# with `slti ...,0x1E0` (Y=480) — NOT the Tomba defaults 0x140/0xE0. These
# match the exact screen_w_imms/screen_h_imms of Bloody Roar II (SCUS-94424 /
# SLES-01722), which shares the same Eighting fighting-game funnel.
# NOTE: STEP40 overlay must be captured (overlay_cache=true) and recompiled
# (compile_overlays.py) for the widened culls to take effect in fight code.
screen_w_imms = ["0x200"]
screen_h_imms = ["0x1E0"]
auto_backdrop = false

[controller]
default_mode = "digital"
lock_mode = true
# Final Bout's battle/card transaction clears TX_EN between bytes while the
# selected SIO device is still active. Keep the compatibility scoped to this
# title; the global SIO model remains hardware-gated by default.
sio_no_tx_gate = true

# STEP40 battle overlay (complete). The runtime capture records dispatch/
# executed PCs, but the STEP40 battle overlay's dispatch PCs are interior
# points (not function starts), so the classifier would reject the region as
# "data-only" and leave the fight interpreted -> spin_freeze. These are the
# REAL function starts found by scanning the full STEP40 member (2026-08-21):
# the member maps to RAM base 0x80060000 (file offset 0x22060, size 0x12354),
# covering the whole ~60KB fight code. The list = the 35 proven function
