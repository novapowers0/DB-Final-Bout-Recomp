# True-widescreen codegen sites. The psx.enhancement.widescreen mod moves the
# display aspect off 4:3; auto_screen_x then widens every GTE screen-extent
# cull that matches the render-funnel signature so the fight reveals the extra
# horizontal world (identity at 4:3). auto_backdrop preloads scrolling
# backdrop column windows for the wider frame. gte_game_mode arms the generic
# 3D-activity detector that keeps menus/2D from being stretched.
[widescreen]
gte_game_mode = true
# squash=false: the GTE X-squash corrupts this game (its gameplay/rendering
# logic reads projected SXY for actor culling and UI layout, so compressed
# coords drop character polygons and break menus). With squash off the guest
# stays 100% vanilla and the 4:3 frame is presented stretched to the wide
# aspect — no FOV widening, zero guest corruption.
squash = false
native_wide = false

[widescreen.cull]
auto_screen_x = true
auto_backdrop = true

[controller]
default_mode = "digital"
lock_mode = true

