format_version = 6
id = "dbfb.responsive"
version = "0.1.0"
name = "Final Bout — Combate renovado"
author = "NovaPowers"
description = "Perfil estándar de combate: respuesta, remates aéreos nativos, ritmo de ataques, aceleración y frenado, ki, defensa, hit-stop, cancelación tras impacto, ráfagas acotadas, técnicas con menor coste, cámara general más abierta, cámara de KO e IA según dificultad. Incluye una transición nueva del brazo para el registro de animación 0 verificado. Experimental, sin balance exhaustivo."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"

[[target]]
game_id = "SLUS-00493"

[[feature]]
id = "standard"
name = "Combate renovado"
description = "Activar y jugar: entradas, remates aéreos por su ventana nativa, ataques y poses retimados juntos, aceleración/frenado, ki, guardia, hit-stop, empuje y cancelación tardía tras acertar. Ráfagas al 125% con duración limitada y técnicas con coste al 80%. Transición nueva de recuperación del brazo solo para el registro 0 verificado. Cámara general más abierta (opt-out DBFB_CAMERA_FRAMING=0), cámara de KO e IA según dificultad. Respeta pausa y estados guardados. Experimental: el vuelo puede conservar recortes de cámara originales y el balance no es exhaustivo. Solo offline."
group = "Combate"
default_enabled = false
channel = "experimental"

[[plugin]]
feature = "standard"
id = "dbfb.responsive.standard"

[[feature]]
id = "unlock-all"
name = "Todos los personajes"
description = "Desbloquea los 17 luchadores (incluido Goku SSJ4) sin teclear el código en la pantalla de título: escribe el valor del truco original (0x1FFFF) en la tabla de personajes, solo desde los estados conocidos (0x7DF o 0x1BFFF). Solo offline."
group = "Combate"
default_enabled = false
channel = "experimental"

[[plugin]]
feature = "unlock-all"
id = "dbfb.responsive.unlock-all"

# Diagnostic instrumentation is absent from release builds.
[[feature]]
id = "trace"
name = "Combat trace (read-only)"
description = "Developer capture of input and fighter/script state; independent of the standard combat mode."
group = "Development"
default_enabled = false
channel = "developer"

[[plugin]]
feature = "trace"
id = "dbfb.responsive.trace"
